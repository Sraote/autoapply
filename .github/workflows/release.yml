name: release
# Build wheel + Linux/Windows bundles → install-test each bundle on its own OS → publish a
# GitHub Release with the assets. Nothing is published if a smoke test fails.
# Trigger either by pushing a tag (v0.1.0), or from the Actions tab ("Run workflow") with a
# version: the release then creates that tag on the commit it was run from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches package version
        run: |
          V="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          [ "v$V" = "$TAG" ] || { echo "Tag $TAG != pyproject version $V"; exit 1; }
      - name: Test
        run: |
          uv sync
          uv run ruff check src tests
          uv run playwright install --with-deps chromium
          uv run pytest -q
      - name: Build wheel and sdist
        run: uv build
      - name: Assemble Linux and Windows bundles
        run: |
          V="${TAG#v}"
          L="autoapply-$V-linux"; W="autoapply-$V-windows"
          mkdir -p "stage/$L" "stage/$W"
          cp dist/*.whl README.md LICENSE "stage/$L/"
          cp packaging/install.sh "stage/$L/" && chmod +x "stage/$L/install.sh"
          cp dist/*.whl README.md LICENSE packaging/install.ps1 "stage/$W/"
          tar -C stage -czf "dist/$L.tar.gz" "$L"
          (cd stage && zip -qr "../dist/$W.zip" "$W")
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Install from the Linux bundle (fresh machine, no uv)
        run: |
          tar -xzf dist/autoapply-*-linux.tar.gz
          cd autoapply-*-linux
          SKIP_SYSTEM_DEPS=1 AUTOAPPLY_SKIP_BROWSER=1 ./install.sh 2>&1 | tee ../install.log
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { tail -n 15 ../install.log | sed 's/^/::error::/'; exit "$rc"; }
      - name: Run the installed app
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          autoapply --version
          autoapply doctor
          test -f ~/autoapply/config/config.yaml
          test -f ~/autoapply/config/profile_data.yaml

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Install from the Windows bundle (fresh machine, no uv)
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist\autoapply-*-windows.zip).FullName -DestinationPath .
          $dir = (Get-ChildItem -Directory autoapply-*-windows).FullName
          $log = powershell -ExecutionPolicy Bypass -File "$dir\install.ps1" -SkipBrowser 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $log
          if ($code -ne 0) {
            # Surface the tail as annotations so failures are readable without the raw log.
            ($log -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 15) |
              ForEach-Object { Write-Output "::error::$_" }
            exit $code
          }
      - name: Run the installed app
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          foreach ($cmd in @("--version", "doctor")) {
            $out = autoapply $cmd 2>&1 | Out-String
            Write-Output $out
            if ($LASTEXITCODE -ne 0) {
              ($out -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 15) |
                ForEach-Object { Write-Output "::error::autoapply ${cmd}: $_" }
              exit 1
            }
          }
          if (-not (Test-Path "$env:USERPROFILE\autoapply\config\config.yaml")) {
            Write-Output "::error::workspace config.yaml was not created"; exit 1
          }

  publish:
    needs: [smoke-linux, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          # --target creates the tag at this commit when it doesn't exist yet (manual runs).
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "autoapply $TAG" \
            --notes-file "$NOTES"
