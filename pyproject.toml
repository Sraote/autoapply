[project]
name = "autoapply"
version = "0.1.0"
description = "Human-in-the-loop job application assistant for internships and entry-level roles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanjiv Raote" }]
dependencies = [
  "playwright>=1.47",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "textual>=0.70",
  "desktop-notifier>=5.0",
  "pypdf>=4.2",
]

[project.scripts]
autoapply = "autoapply.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoapply"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/autoapply/cli.py" = ["B008"]           # Typer's documented Option() pattern
"src/autoapply/automation/fields.py" = ["E501"]  # embedded JavaScript
"tests/*" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
